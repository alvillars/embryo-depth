[project]
name = "embryo-depth"
version = "0.1.0"
description = "Depth-resampled viewing of light-sheet embryo volumes stored as OME-Zarr"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Villars" }]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The store is zarr v2 and ome-zarr is v2-oriented; zarr 3 changes the API
    # and the semantics of write_empty_chunks.
    "zarr>=2.17,<3",
    "numcodecs<0.16",
    "dask[array]",
    "numpy",
    "scipy",
    "scikit-image",
    "ome-zarr",
    "napari[all]",
    "npe2",
    "magicgui",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.entry-points."napari.manifest"]
embryo-depth = "embryo_depth:napari.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embryo_depth"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

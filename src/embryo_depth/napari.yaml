name: embryo-depth
display_name: Embryo depth shells

contributions:
  commands:
    - id: embryo-depth.shell_widget
      title: Depth shell viewer
      python_name: embryo_depth.plugin:depth_shell_widget
    - id: embryo-depth.get_reader
      title: Open embryo depth store
      python_name: embryo_depth.reader:napari_get_reader
  widgets:
    - command: embryo-depth.shell_widget
      display_name: Depth shells
  readers:
    - command: embryo-depth.get_reader
      accepts_directories: true
      filename_patterns: ["*.ome.zarr", "*.zarr"]
